name: Store preview checks
on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: store-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check repository for secret files
        run: pnpm check:secrets
      - name: Verify every current product download
        run: pnpm verify:inventory
      - name: Check types
        run: pnpm exec tsc --noEmit
      - name: Test protected checkout, delivery, and editor publishing
        run: pnpm test:store
      - name: Build read-only preview
        run: pnpm preview:build
      - name: Preserve private review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-store-preview-${{ github.sha }}
          path: |
            dist/
            .sites-runtime/staging/bootstrap.sql
          include-hidden-files: true
          retention-days: 7
      - name: Explain publishing boundary
        run: echo 'Preview checks complete. No live deployment is performed by this workflow.' >> "$GITHUB_STEP_SUMMARY"
